[project]
name = "data_pipeline"
version = "0.1.0"
description = "Zentral Hack 2026: scrapers, records, embeddings and data interfaces (Scope 1, Dijar)"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pillow>=10.0",
  "playwright>=1.45",
  # embeddings + index (torch: install CPU wheels on Linux, see [tool.uv] below; MPS works on the Mac)
  "numpy>=1.26",
  "torch>=2.3",
  "transformers>=4.44",
  "open_clip_torch>=2.26",
  "faiss-cpu>=1.8",
  # composite splitter
  "opencv-python-headless>=4.9",
  "anthropic>=0.40",
  # date hints: year probe on image embeddings
  "scikit-learn>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
