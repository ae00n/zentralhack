[project]
name = "data_pipeline"
version = "0.1.0"
description = "Zentral Hack 2026: scrapers, records, embeddings and data interfaces (Scope 1, Dijar)"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pillow>=10.0",
  "playwright>=1.45",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
